name: FlipperControl
options:
  bundleIdPrefix: es.k41k35
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  FlipperControl:
    type: application
    platform: iOS
    info:
      path: FlipperControl/Info.plist
      properties:
        CFBundleDisplayName: Flipper Control
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSBluetoothAlwaysUsageDescription: Conecta y controla tu Flipper Zero mediante Bluetooth.
        UIBackgroundModes:
          - bluetooth-central
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: FlipperControl
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.k41k35.FlipperControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: 'NO'
        MARKETING_VERSION: '0.9.0'
        CURRENT_PROJECT_VERSION: '9'
        SWIFT_EMIT_LOC_STRINGS: 'YES'
